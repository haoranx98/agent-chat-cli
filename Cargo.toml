[package]
name = "agent-chat"
version = "0.5.0"
edition = "2024"
description = "A small CLI chat client for OpenAI-compatible agent servers"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
rustyline = "15"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures-util = "0.3"

[dev-dependencies]
wiremock = "0.6"
